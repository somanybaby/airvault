name: NAS test image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build amd64 image archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          tags: airvault-zh:nas-test
          build-args: VERSION=zh-CN-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          outputs: type=docker,dest=/tmp/airvault-zh.tar
      - name: Package image and corresponding source
        run: |
          mkdir /tmp/airvault-package
          gzip -1 /tmp/airvault-zh.tar
          mv /tmp/airvault-zh.tar.gz /tmp/airvault-package/
          git archive --format=tar.gz --prefix=airvault/ HEAD > /tmp/airvault-package/airvault-source.tar.gz
          cd /tmp/airvault-package
          sha256sum airvault-zh.tar.gz airvault-source.tar.gz > SHA256SUMS
      - name: Upload deployment package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: airvault-zh-amd64
          path: /tmp/airvault-package/
          compression-level: 0
          retention-days: 3
